# SimpleCal 实验性 compose 配置，与同目录 Dockerfile 配套。
services:
  simplecal:
    build: .
    image: simplecal:dev
    container_name: simplecal
    restart: unless-stopped
    ports:
      - "5581:5280"
    environment:
      CALDAV_HOST: "0.0.0.0"
      CALDAV_PORT: "5280"
      CALDAV_USER: "caldav"
      # 仅在首次初始化管理员时使用；之后修改此值不会重置已有密码。
      CALDAV_ADMIN_PASSWORD: "${CALDAV_ADMIN_PASSWORD:-}"
    volumes:
      - simplecal-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5280/api/version').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  simplecal-data:
